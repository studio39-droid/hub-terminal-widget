<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary</title>
<style>
:root{--bg:#191919;--fg:#f2f2f2;--muted:#8b8b8b;--muted2:#777;--panel:#202020;--sub:#1b1b1b;--control:#242424;--border:#303030;--border2:#383838;--border3:#3a3a3a;--active:#4a4a4a;--link:#aaa;--source:#606060;--error:#d99;--ok:#8fbf9f}
@media(prefers-color-scheme:light){:root{--bg:#f7f7f5;--fg:#252525;--muted:#777;--muted2:#888;--panel:#fff;--sub:#f3f3f1;--control:#f1f1ef;--border:#ddd;--border2:#d4d4d2;--border3:#d0d0ce;--active:#aaa;--link:#555;--source:#999;--error:#a44;--ok:#487a58}}
*{box-sizing:border-box}body{margin:0;padding:8px 10px 8px 0;background:var(--bg);color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.vocab{height:184px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--panel);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.vocabHead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kicker score" "word word" "meta meta";align-content:start;min-width:0}.vocabKicker{grid-area:kicker;font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vocabWord{grid-area:word;font-size:28px;font-weight:350;line-height:1.05;letter-spacing:-.02em;margin-top:3px;overflow-wrap:anywhere}.vocabMeta{grid-area:meta;font-size:10px;color:var(--muted2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{grid-area:score;font-size:9px;color:var(--source);white-space:nowrap;margin-left:8px;align-self:center}.vocabBody{position:relative;display:flex;flex:1;min-height:0;flex-direction:column;justify-content:flex-start;gap:5px}.choices{display:grid;grid-template-columns:1fr;gap:4px;min-height:0}.choice{min-height:29px;padding:5px 8px;border:1px solid var(--border2);border-radius:8px;background:var(--sub);color:var(--fg);font:inherit;font-size:12px;line-height:1.2;text-align:left;cursor:pointer}.choice:hover{border-color:var(--active)}.choice:disabled{cursor:default}.choice.correct{border-color:var(--ok)}.choice.wrong{border-color:var(--error);opacity:.78}.answer{display:none;color:var(--muted)}.answer.show{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:8px;row-gap:4px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--sub);overflow:hidden}.answerMark{grid-column:1;grid-row:1;font-weight:700}.answerMark.ok{color:var(--ok)}.answerMark.ng{color:var(--error)}.answer.show>div:not(.vocabActions){grid-column:2;grid-row:1/3;min-width:0}.answerText{color:var(--fg);font-size:12px;line-height:1.2}.answerExplain{font-size:11px;line-height:1.25;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.vocabActions{grid-column:1/-1;grid-row:3;display:flex;gap:5px;white-space:nowrap}.vocabLink,.nextBtn{height:27px;padding:0 8px;border:1px solid var(--border3);border-radius:7px;background:var(--control);color:var(--link);font:inherit;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:1}.vocabLink:hover,.nextBtn:hover{color:var(--fg)}
@media(max-width:720px){.vocab{height:auto;min-height:184px}}
</style></head><body>
<section class="vocab"><div class="vocabHead"><div class="vocabKicker">Learning Hub / Vocabulary</div><div id="vocabWord" class="vocabWord">branch</div><div id="vocabMeta" class="vocabMeta">Git · Programming</div><div id="score" class="score">Correct 0 / Wrong 0</div></div><div class="vocabBody"><div id="choices" class="choices"></div><div id="answer" class="answer"><span id="answerMark" class="answerMark"></span><div><div id="answerText" class="answerText"></div><div id="answerExplain" class="answerExplain"></div></div><div class="vocabActions"><a id="detailLink" class="vocabLink" target="_blank" rel="noopener noreferrer">詳しく理解する ↗</a><button id="nextWord" class="nextBtn">次の単語 →</button></div></div></div></section>
<script>
(()=>{const q=s=>document.querySelector(s);const fallbackVocab=[{word:'branch',meaning:'分岐／枝分かれ',explain:'Gitでは、元の開発ラインを保ったまま別の変更を進めるための分岐。',cat:'Git · Programming',detail:'#'},{word:'merge',meaning:'統合する／合流する',explain:'別々に進めた変更を1つの開発ラインへまとめること。',cat:'Git',detail:'#'},{word:'commit',meaning:'変更を記録する',explain:'Gitで、その時点の変更内容を履歴として保存する単位。',cat:'Git',detail:'#'}];let vocab=[...fallbackVocab];const vocabWord=q('#vocabWord'),vocabMeta=q('#vocabMeta'),choices=q('#choices'),answer=q('#answer'),answerMark=q('#answerMark'),answerText=q('#answerText'),answerExplain=q('#answerExplain'),detailLink=q('#detailLink'),nextWord=q('#nextWord'),score=q('#score');let current=-1,stats={correct:0,wrong:0};try{stats=JSON.parse(localStorage.getItem('hub-vocab-stats'))||stats}catch{}const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function saveStats(){try{localStorage.setItem('hub-vocab-stats',JSON.stringify(stats))}catch{}}async function loadVocab(){try{const response=await fetch('./vocab.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(Array.isArray(data)&&data.length>=3)vocab=data}catch(e){console.warn('Vocabulary sync fallback:',e)}showWord()}function makeChoices(item){const wrongPool=vocab.filter(v=>v.word!==item.word).map(v=>v.meaning);return shuffle([item.meaning,...shuffle(wrongPool).slice(0,2)])}function showWord(){let next=current;while(vocab.length>1&&next===current)next=Math.floor(Math.random()*vocab.length);current=next<0?0:next;const item=vocab[current];vocabWord.textContent=item.word;vocabMeta.textContent=item.cat;score.textContent=`Correct ${stats.correct} / Wrong ${stats.wrong}`;detailLink.href=item.detail||'#';answer.classList.remove('show');choices.innerHTML='';makeChoices(item).forEach(text=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>answerChoice(b,text,item);choices.appendChild(b)})}function answerChoice(button,text,item){[...choices.children].forEach(b=>{b.disabled=true;if(b.textContent===item.meaning)b.classList.add('correct')});const ok=text===item.meaning;if(!ok)button.classList.add('wrong');stats[ok?'correct':'wrong']++;saveStats();score.textContent=`Correct ${stats.correct} / Wrong ${stats.wrong}`;answerMark.textContent=ok?'✓':'×';answerMark.className='answerMark '+(ok?'ok':'ng');answerText.textContent=item.meaning;answerExplain.textContent=item.explain;answer.classList.add('show')}nextWord.onclick=showWord;loadVocab()})();
</script></body></html>
