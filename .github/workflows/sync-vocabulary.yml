name: Sync Notion Vocabulary

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: sync-vocabulary
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch vocabulary from Notion
        run: node scripts/sync-notion-vocab.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_VOCAB_DATA_SOURCE_ID: 8345f227-91fd-49e6-b6a8-2c7e42c80302
      - name: Commit updated vocabulary
        run: |
          if git diff --quiet -- vocab.json; then
            echo "Vocabulary is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocab.json
          git commit -m "Sync vocabulary from Notion"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected (main moved), retrying with rebase (attempt $attempt)..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase could not be applied automatically (likely someone else also touched vocab.json). Aborting without forcing."
              git rebase --abort
              exit 1
            fi

            sleep $((attempt * 3))
          done

          echo "Push still rejected after retries."
          exit 1
