<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub Terminal</title>
<style>
:root{
  --bg:#191919;--fg:#f2f2f2;--muted:#8b8b8b;--muted2:#777;
  --panel:#202020;--sub:#1b1b1b;--control:#242424;
  --border:#303030;--border2:#383838;--border3:#3a3a3a;
  --active:#4a4a4a;--link:#aaa;--source:#606060;
  --error:#d99;--second:#e5484d;--ok:#8fbf9f;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f7f7f5;--fg:#252525;--muted:#777;--muted2:#888;
    --panel:#fff;--sub:#f3f3f1;--control:#f1f1ef;
    --border:#ddd;--border2:#d4d4d2;--border3:#d0d0ce;
    --active:#aaa;--link:#555;--source:#999;--error:#a44;
    --second:#d9363e;--ok:#487a58;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{padding:8px 10px}
.grid{display:grid;grid-template-columns:170px minmax(390px,1fr) 290px minmax(300px,340px);gap:10px;align-items:stretch}
.clock{display:flex;align-items:center;justify-content:center;height:184px;cursor:pointer;user-select:none;overflow:hidden}
.digital,.analogWrap{display:flex;flex-direction:column;align-items:center;justify-content:center}
.analogWrap{display:none;height:100%;width:100%}.clock.analog .digital{display:none}.clock.analog .analogWrap{display:flex}
.now{font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}.hm{font-size:52px}
.sec{font-size:18px;color:var(--muted);letter-spacing:.04em;line-height:1;margin-top:4px}
.date{margin-bottom:5px;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.analogFace{position:relative;width:164px;height:164px;border:1px solid var(--border2);border-radius:50%;background:var(--sub)}
.tick{position:absolute;inset:0;transform:rotate(calc(var(--i)*30deg))}
.tick:after{content:"";position:absolute;left:50%;top:7px;width:1px;height:8px;background:var(--muted2);transform:translateX(-50%);border-radius:1px}
.tick:nth-child(3n+1):after{height:11px;background:var(--muted)}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:2px;z-index:3}
.hourHand{width:2px;height:24%;margin-left:-1px;background:var(--fg)}.minuteHand{width:1.5px;height:34%;margin-left:-.75px;background:var(--fg)}
.secondHand{width:1px;height:40%;margin-left:-.5px;background:var(--second)}.pin{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:var(--fg);z-index:4}
.analogStack{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;z-index:2;line-height:1.03}
.analogStack span{font-size:17px;font-weight:300}.analogDateStack{left:34px;color:var(--muted)}.analogTimeStack{right:34px;color:var(--fg)}
.analogStack .small{font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.panel,.weather,.vocab{border:1px solid var(--border);border-radius:11px;background:var(--panel);min-width:0;height:184px}
.panel{padding:13px 14px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.taskrow{display:grid;grid-template-columns:minmax(116px,1fr) auto;gap:6px;align-items:center}
.sel{width:100%;min-width:0;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--border2);background:var(--sub);color:var(--fg);font-size:14px}
.actions{display:flex;gap:4px;align-items:center;white-space:nowrap}
.btn,.pomoBtn{height:38px;padding:0;border-radius:8px;border:1px solid var(--border3);background:var(--control);color:var(--muted2);line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn{width:38px;font-size:16px}#start{font-size:13px}.btn#stop,.btn#finish{font-size:19px}.pomoBtn{width:56px;font-size:11px;letter-spacing:.08em}
.btn.active,.pomoBtn.active{color:var(--fg);border-color:var(--active)}.btn:disabled{opacity:1;cursor:default}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}.meter{border:1px solid var(--border);border-radius:9px;background:var(--sub);padding:11px 14px;min-width:0}
.label{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.value{margin-top:3px;font-size:32px;font-weight:300;line-height:1.02;font-variant-numeric:tabular-nums}
.tiny{margin-top:4px;color:var(--muted2);font-size:12px}.off{font-size:14px!important;color:var(--muted2)!important;letter-spacing:.06em;text-transform:uppercase;margin-top:7px}
.err{grid-column:1/-1;color:var(--error);font-size:10px}
.weather{padding:22px 20px;display:flex;align-items:stretch;justify-content:space-between;gap:12px}
.wleft{min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}.place{font-size:16px;letter-spacing:.08em;color:var(--muted)}
.wmain{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;align-items:center;justify-content:center;column-gap:9px;row-gap:2px;transform:translateY(-5px)}
.wmain .icon{grid-column:1}.wmain .weatherText{grid-column:2;display:flex;align-items:center}.wmain .desc{grid-column:1/3;text-align:center}
.icon{font-size:32px;line-height:1;filter:grayscale(1);opacity:.9}.temp{font-size:36px;font-weight:300;line-height:1}.desc{font-size:12px;color:var(--link);white-space:nowrap}
.wmeta{display:flex;flex-direction:column;justify-content:space-between;text-align:right;color:var(--muted);font-size:15px;white-space:nowrap}.source{color:var(--source);font-size:10px}
.wxlink{color:var(--link);text-decoration:none;font-size:12px}.wxlink:hover{color:var(--fg);text-decoration:underline}

/* Vocabulary card */
.vocab{padding:12px 14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.vocabHead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"kicker score" "word word" "meta meta";align-content:start;min-width:0}
.vocabKicker{grid-area:kicker;font-size:9px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vocabWord{grid-area:word;font-size:28px;font-weight:350;line-height:1.05;letter-spacing:-.02em;margin-top:3px;overflow-wrap:anywhere}
.vocabMeta{grid-area:meta;font-size:10px;color:var(--muted2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{grid-area:score;font-size:9px;color:var(--source);white-space:nowrap;margin-left:8px;align-self:center}
.vocabBody{position:relative;display:flex;flex:1;min-height:0;flex-direction:column;justify-content:flex-start;gap:5px}
.choices{display:grid;grid-template-columns:1fr;gap:4px;min-height:0}
.choice{min-height:29px;padding:5px 8px;border:1px solid var(--border2);border-radius:8px;background:var(--sub);color:var(--fg);font:inherit;font-size:12px;line-height:1.2;text-align:left;cursor:pointer}
.choice:hover{border-color:var(--active)}.choice:disabled{cursor:default}
.choice.correct{border-color:var(--ok)}.choice.wrong{border-color:var(--error);opacity:.78}
.answer{display:none;color:var(--muted)}
.answer.show{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:8px;row-gap:4px;padding:7px 8px;border:1px solid var(--border);border-radius:8px;background:var(--sub);overflow:hidden}
.answerMark{grid-column:1;grid-row:1;font-weight:700}.answerMark.ok{color:var(--ok)}.answerMark.ng{color:var(--error)}
.answer.show>div:not(.vocabActions){grid-column:2;grid-row:1/3;min-width:0}
.answerText{color:var(--fg);font-size:12px;line-height:1.2}
.answerExplain{font-size:11px;line-height:1.25;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vocabActions{grid-column:1/-1;grid-row:3;display:flex;gap:5px;white-space:nowrap}
.vocabLink,.nextBtn{height:27px;padding:0 8px;border:1px solid var(--border3);border-radius:7px;background:var(--control);color:var(--link);font:inherit;font-size:11px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.vocabLink,.nextBtn{flex:1}.vocabLink:hover,.nextBtn:hover{color:var(--fg)}

@media(max-width:1180px){
  .grid{grid-template-columns:minmax(260px,.8fr) minmax(390px,1.2fr)}
  .clock,.panel,.weather,.vocab{height:184px}
}
@media(max-width:720px){
  .grid{grid-template-columns:1fr}.clock,.panel,.weather,.vocab{height:auto;min-height:160px}
  .taskrow{grid-template-columns:1fr}.actions{flex-wrap:wrap}
  .vocab{min-height:184px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="grid">
    <div id="clockBox" class="clock" title="Click to switch Digital / Analog">
      <div class="digital"><div id="date" class="date">---</div><div class="now"><span id="hm" class="hm">--:--</span></div><div id="sec" class="sec">--</div></div>
      <div class="analogWrap"><div class="analogFace">
        <span class="tick" style="--i:0"></span><span class="tick" style="--i:1"></span><span class="tick" style="--i:2"></span><span class="tick" style="--i:3"></span>
        <span class="tick" style="--i:4"></span><span class="tick" style="--i:5"></span><span class="tick" style="--i:6"></span><span class="tick" style="--i:7"></span>
        <span class="tick" style="--i:8"></span><span class="tick" style="--i:9"></span><span class="tick" style="--i:10"></span><span class="tick" style="--i:11"></span>
        <div class="analogStack analogDateStack"><span id="aMonth">--</span><span id="aDay">--</span><span id="aWeek" class="small">---</span></div>
        <div class="analogStack analogTimeStack"><span id="aHour">--</span><span id="aMinute">--</span><span id="aSecond">--</span></div>
        <span id="hourHand" class="hand hourHand"></span><span id="minuteHand" class="hand minuteHand"></span><span id="secondHand" class="hand secondHand"></span><span class="pin"></span>
      </div></div>
    </div>

    <section class="panel">
      <div class="taskrow">
        <select id="task" class="sel">
          <option value="">— Select task —</option>
          <option>Hub Terminal UI設計</option>
          <option>Deco Reco 仕様変更</option>
          <option>Ticket 構想整理</option>
          <option>その他</option>
        </select>
        <div class="actions">
          <button id="pomoBtn" class="pomoBtn">POMO</button>
          <button id="start" class="btn active">▶</button>
          <button id="stop" class="btn" disabled>⏸</button>
          <button id="finish" class="btn" disabled>✓</button>
        </div>
        <div id="err" class="err"></div>
      </div>
      <div class="times">
        <div class="meter"><div class="label">Work</div><div id="work" class="value">00:00:00</div><div id="workSub" class="tiny">Idle</div></div>
        <div class="meter"><div class="label">Pomodoro</div><div id="pomoTime" class="value off">Off</div><div id="pomoSub" class="tiny">Focus 25 / Break 5</div></div>
      </div>
    </section>

    <aside class="weather">
      <div class="wleft">
        <div class="place">Tokushima</div>
        <div class="wmain"><div id="wicon" class="icon">·</div><div class="weatherText"><div id="temp" class="temp">--°</div></div><div id="desc" class="desc">Loading...</div></div>
        <span class="source">Data: Open-Meteo</span>
      </div>
      <div class="wmeta">
        <span id="rain">Rain --%</span><span id="highlow">H --° / L --°</span><span id="feel">Feels --°</span>
        <a class="wxlink" href="https://weathernews.jp/onebox/tenki/tokushima/36201/" target="_blank" rel="noopener noreferrer">Weathernews ↗</a>
      </div>
    </aside>

    <section class="vocab">
      <div class="vocabHead">
        <div class="vocabKicker">Learning Hub / Vocabulary</div>
        <div id="vocabWord" class="vocabWord">branch</div>
        <div id="vocabMeta" class="vocabMeta">Git · Programming</div>
        <div id="score" class="score">Correct 0 / Wrong 0</div>
      </div>
      <div class="vocabBody">
        <div id="choices" class="choices"></div>
        <div id="answer" class="answer">
          <span id="answerMark" class="answerMark"></span>
          <div>
            <div id="answerText" class="answerText"></div>
            <div id="answerExplain" class="answerExplain"></div>
          </div>
          <div class="vocabActions">
            <a id="detailLink" class="vocabLink" target="_blank" rel="noopener noreferrer">詳しく理解する ↗</a>
            <button id="nextWord" class="nextBtn">次の単語 →</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(()=>{
const q=s=>document.querySelector(s);

// Clock
const clockBox=q('#clockBox'),hm=q('#hm'),sec=q('#sec'),date=q('#date'),aMonth=q('#aMonth'),aDay=q('#aDay'),aWeek=q('#aWeek'),
aHour=q('#aHour'),aMinute=q('#aMinute'),aSecond=q('#aSecond'),hourHand=q('#hourHand'),minuteHand=q('#minuteHand'),secondHand=q('#secondHand');
let clockMode='digital';try{clockMode=localStorage.getItem('hub-terminal-clock')||'digital'}catch{}
function applyClock(){clockBox.classList.toggle('analog',clockMode==='analog')}
clockBox.onclick=()=>{clockMode=clockMode==='digital'?'analog':'digital';try{localStorage.setItem('hub-terminal-clock',clockMode)}catch{}applyClock()}
const pad=n=>String(Math.floor(n)).padStart(2,'0'),hms=s=>pad(s/3600)+':'+pad((s%3600)/60)+':'+pad(s%60),mmss=s=>pad(s/60)+':'+pad(s%60);
function tickClock(){const d=new Date,h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();hm.textContent=pad(h)+':'+pad(m);sec.textContent=pad(s);date.textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'2-digit'}).toUpperCase();aMonth.textContent=pad(d.getMonth()+1);aDay.textContent=pad(d.getDate());aWeek.textContent=d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();aHour.textContent=pad(h);aMinute.textContent=pad(m);aSecond.textContent=pad(s);hourHand.style.transform=`rotate(${(h%12)*30+m*.5}deg)`;minuteHand.style.transform=`rotate(${m*6+s*.1}deg)`;secondHand.style.transform=`rotate(${s*6}deg)`}

// Timer / Pomo
const task=q('#task'),err=q('#err'),work=q('#work'),workSub=q('#workSub'),pomoTime=q('#pomoTime'),pomoSub=q('#pomoSub'),
start=q('#start'),stop=q('#stop'),finish=q('#finish'),pomoBtn=q('#pomoBtn');
let mode='idle',w=0,fr=1500,fo=0,br=300,bro=0,pomoOn=false;
function buttons(){const running=mode==='work';start.classList.toggle('active',!running);stop.classList.toggle('active',running);finish.classList.toggle('active',running);start.disabled=running;stop.disabled=!running;finish.disabled=!running;pomoBtn.classList.toggle('active',pomoOn)}
function render(){work.textContent=hms(w);workSub.textContent=mode==='work'?(task.value||'Working'):mode==='break'?'Break':'Idle';if(!pomoOn){pomoTime.textContent='Off';pomoTime.className='value off';pomoSub.textContent='Focus 25 / Break 5'}else if(mode==='break'){pomoTime.className='value';pomoTime.textContent=br>0?mmss(br):'+'+mmss(bro);pomoSub.textContent='Break'}else{pomoTime.className='value';pomoTime.textContent=fr>0?mmss(fr):'+'+mmss(fo);pomoSub.textContent='Focus'}buttons()}
setInterval(()=>{if(mode==='work'){w++;if(pomoOn){fr>0?fr--:fo++}}else if(mode==='break'&&pomoOn){br>0?br--:bro++}render()},1000);
start.onclick=()=>{if(!task.value){err.textContent='タスクを選択してください';return}err.textContent='';mode='work';task.disabled=true;render()}
stop.onclick=()=>{if(mode==='work'){mode='break';task.disabled=false;if(pomoOn){br=300;bro=0}}render()}
finish.onclick=()=>{mode='idle';task.disabled=false;render()}
pomoBtn.onclick=()=>{pomoOn=!pomoOn;render()}

// Weather
const codes={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Drizzle'],61:['🌧️','Rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Snow'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorm']};
async function weather(){try{const u='https://api.open-meteo.com/v1/forecast?latitude=34.0703&longitude=134.5548&current=temperature_2m,apparent_temperature,weather_code&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=1';const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),c=j.current,d=j.daily,ix=j.hourly.time.indexOf(c.time.slice(0,13)+':00'),wc=codes[c.weather_code]||['•','Weather'];q('#wicon').textContent=wc[0];q('#temp').textContent=Math.round(c.temperature_2m)+'°';q('#desc').textContent=wc[1];q('#feel').textContent='Feels '+Math.round(c.apparent_temperature)+'°';q('#highlow').textContent='H '+Math.round(d.temperature_2m_max[0])+'° / L '+Math.round(d.temperature_2m_min[0])+'°';q('#rain').textContent='Rain '+(ix>=0?j.hourly.precipitation_probability[ix]:'--')+'%'}catch(e){q('#desc').textContent='Weather unavailable'}}

// Vocabulary
const fallbackVocab=[
{word:'branch',meaning:'分岐／枝分かれ',explain:'Gitでは、元の開発ラインを保ったまま別の変更を進めるための分岐。',cat:'Git · Programming',detail:'https://app.notion.com/p/3d3d867b70108144ab88c5872c928b57'},
{word:'merge',meaning:'統合する／合流する',explain:'別々に進めた変更を1つの開発ラインへまとめること。',cat:'Git',detail:'https://app.notion.com/p/3d3d867b701081c0844bc86fbd93c113'},
{word:'commit',meaning:'変更を記録する',explain:'Gitで、その時点の変更内容を履歴として保存する単位。',cat:'Git',detail:'https://app.notion.com/p/3d3d867b701081bdb3f8ee6d5b4bdfb2'},
{word:'repository',meaning:'リポジトリ／保管庫',explain:'コードや変更履歴をまとめて管理するプロジェクトの入れ物。',cat:'Git · Programming',detail:'https://app.notion.com/p/3d3d867b701081f7b8a3fb88f2cce360'},
{word:'dependency',meaning:'依存関係',explain:'あるソフトや機能が動くために必要になる別のライブラリや仕組み。',cat:'Programming',detail:'https://app.notion.com/p/3d3d867b70108105ada6e45ffdfc9c4d'},
{word:'deprecated',meaning:'非推奨になった',explain:'今は動いても、今後の利用をやめる方向になっている機能やAPI。',cat:'Programming',detail:'https://app.notion.com/p/3d3d867b70108177b449db950c51aeb6'},
{word:'fallback',meaning:'代替手段／予備動作',explain:'本来の方法が使えないときに代わりに使う処理や値。',cat:'Programming · General',detail:'https://app.notion.com/p/3d3d867b701081d0ab70d9019d091d8f'},
{word:'upstream',meaning:'本家側／上流',explain:'Gitでは、自分のコピーや派生元になっている本家プロジェクト側を指すことが多い。',cat:'Git · Programming',detail:'https://app.notion.com/p/3d3d867b701081e4af4ae846cdf7da1b'},
{word:'localization',meaning:'ローカライズ／地域・言語対応',explain:'アプリの表示や形式を、特定の言語・地域に合わせること。',cat:'Programming · General',detail:'https://app.notion.com/p/3d3d867b701081508d32cd8e1b5e8c49'},
{word:'infrastructure',meaning:'基盤／インフラ',explain:'他の機能や運用を支える土台となる仕組み全体。',cat:'General · Programming',detail:'https://app.notion.com/p/3d3d867b7010818881ced65a154dfc53'},
{word:'modifier',meaning:'修飾するもの／修飾キー',explain:'キーボードではCommand・Shift・Option・Controlなど、他のキーの働きを変えるキー。',cat:'macOS · Programming',detail:'https://app.notion.com/p/3d3d867b70108197bd31ed519c4c8673'},
{word:'stuck',meaning:'動かない／引っかかった',explain:'技術文脈では、処理やキーなどが本来の状態から戻らず固まっている状態にも使う。',cat:'General · Programming',detail:'https://app.notion.com/p/3d3d867b701081f2bc05f661e375b64e'},
{word:'prevent',meaning:'防ぐ',explain:'問題や動作が起きないようにすること。',cat:'General',detail:'https://app.notion.com/p/3d3d867b7010819faa96c1bfe6c4be76'},
{word:'temporary',meaning:'一時的な',explain:'恒久的ではなく、限られた時間だけ続く状態。',cat:'General',detail:'https://app.notion.com/p/3d3d867b7010816881dbef96eca80d60'},
{word:'available',meaning:'利用可能な／空いている',explain:'機能・物・時間などが使える状態にあること。',cat:'General',detail:'https://app.notion.com/p/3d3d867b701081a896daf7c4f630355d'},
{word:'source of truth',meaning:'正とする唯一の情報源',explain:'複数のコピーではなく、最終的に正しいと判断する基準となるデータや場所。',cat:'Programming · General',detail:'https://app.notion.com/p/3d3d867b701081d9ba81d221378ed024'}
];
let vocab=[...fallbackVocab];
const vocabWord=q('#vocabWord'),vocabMeta=q('#vocabMeta'),choices=q('#choices'),answer=q('#answer'),answerMark=q('#answerMark'),
answerText=q('#answerText'),answerExplain=q('#answerExplain'),detailLink=q('#detailLink'),nextWord=q('#nextWord'),score=q('#score');
let current=-1,stats={correct:0,wrong:0};
try{stats=JSON.parse(localStorage.getItem('hub-vocab-stats'))||stats}catch{}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saveStats(){try{localStorage.setItem('hub-vocab-stats',JSON.stringify(stats))}catch{}}
async function loadVocab(){
  try{
    const response=await fetch('./vocab.json',{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(Array.isArray(data)&&data.length>=3)vocab=data;
  }catch(e){console.warn('Vocabulary sync fallback:',e)}
  showWord();
}
function makeChoices(item){
  const wrongPool=vocab.filter(v=>v.word!==item.word).map(v=>v.meaning);
  return shuffle([item.meaning,...shuffle(wrongPool).slice(0,2)]);
}
function showWord(){
  let next=current;
  while(vocab.length>1&&next===current)next=Math.floor(Math.random()*vocab.length);
  current=next<0?0:next;
  const item=vocab[current];vocabWord.textContent=item.word;vocabMeta.textContent=item.cat;score.textContent=`Correct ${stats.correct} / Wrong ${stats.wrong}`;
  detailLink.href=item.detail;answer.classList.remove('show');choices.innerHTML='';
  makeChoices(item).forEach(text=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>answerChoice(b,text,item);choices.appendChild(b)})
}
function answerChoice(button,text,item){
  [...choices.children].forEach(b=>{b.disabled=true;if(b.textContent===item.meaning)b.classList.add('correct')});
  const ok=text===item.meaning;if(!ok)button.classList.add('wrong');
  stats[ok?'correct':'wrong']++;saveStats();score.textContent=`Correct ${stats.correct} / Wrong ${stats.wrong}`;
  answerMark.textContent=ok?'✓':'×';answerMark.className='answerMark '+(ok?'ok':'ng');
  answerText.textContent=item.meaning;answerExplain.textContent=item.explain;answer.classList.add('show');
}
nextWord.onclick=showWord;

// Init
applyClock();tickClock();setInterval(tickClock,1000);render();weather();setInterval(weather,900000);loadVocab();
})();
</script>
