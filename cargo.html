<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargo Bay</title>
<style>:root{--bg:#191919;--fg:#f2f2f2;--muted:#8b8b8b;--panel:#202020;--sub:#1b1b1b;--control:#242424;--border:#303030;--border2:#383838;--error:#d99;--stage-done:#3a3a3a;--stage-future:#d0d0d0;--stage-current:#4f6b59;--stage-current-border:#668872}@media(prefers-color-scheme:light){:root{--bg:#f7f7f5;--fg:#252525;--muted:#777;--panel:#fff;--sub:#f3f3f1;--control:#f1f1ef;--border:#ddd;--border2:#d4d4d2;--error:#a44;--stage-done:#d0d0ce;--stage-future:#f1f1ef;--stage-current:#dbe8df;--stage-current-border:#789681}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:12px;max-width:1200px;margin:auto}header,.active{display:flex;justify-content:space-between;align-items:center;gap:10px}header{margin-bottom:12px}h1{font-size:20px;margin:0}.sub,label,.raw{font-size:10px;color:var(--muted)}button,input,select{font:inherit;color:var(--fg);background:var(--control);border:1px solid var(--border2);border-radius:8px}.btn{height:34px;padding:0 12px}.panel,.active,.form{border:1px solid var(--border);border-radius:11px;background:var(--panel)}.active{display:none;padding:10px 12px;margin-bottom:10px}.active.show{display:flex}.activeStage{font-size:12px;color:var(--muted);margin-top:2px}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}th{font-size:10px;color:var(--muted)}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--sub)}tr[data-id].selected{background:var(--sub)}.op{width:1%;white-space:nowrap}.quickStart{height:30px;padding:0 10px;font-size:12px}.risk{color:var(--error)}.detail{display:none;padding:12px;background:var(--sub)}.detail.show{display:block}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.detailGrid{display:grid;grid-template-columns:minmax(90px,.7fr) minmax(240px,2.1fr) minmax(125px,1fr) minmax(125px,1fr);gap:8px}.field input,.field select{width:100%;height:34px;padding:0 8px}.stages,.actions,.totals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.stage,.total{padding:7px 9px;border:1px solid var(--border);border-radius:8px}.stage{color:#252525;background:var(--stage-future);border-color:var(--stage-future)}.stage.done{color:var(--fg);background:var(--stage-done);border-color:var(--stage-done)}.stage.current{color:var(--fg);background:var(--stage-current);border-color:var(--stage-current-border);box-shadow:inset 0 0 0 1px var(--stage-current-border)}.total b{font-variant-numeric:tabular-nums}.form{display:none;padding:12px;margin-top:10px}.form.show{display:block}.empty{text-align:center;color:var(--muted);padding:20px}@media(max-width:760px){.grid,.detailGrid{grid-template-columns:1fr 1fr}}</style></head>
<body><div class="wrap"><header><div><h1>Cargo Bay</h1><div class="sub">Hub Terminal / Tasks</div></div><button id="add" class="btn">＋ タスク追加</button></header>
<div id="active" class="active"><div><b id="activeTitle"></b><div id="activeStage" class="activeStage"></div></div><div><button id="pause" class="btn">中断</button> <button id="sessionClose" class="btn" title="Session終了 / 工程は継続">■ Session終了</button> <button id="complete" class="btn">完了</button></div></div>
<section class="panel"><table><thead><tr><th>カテゴリ</th><th>案件</th><th>現在地</th><th>期日</th><th>デッドライン</th><th class="op">START</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Cargoはまだありません</div><div id="detail" class="detail"></div></section>
<form id="form" class="form"><div class="grid"><div class="field"><label>カテゴリ</label><select id="cat"><option>写真</option><option>その他</option></select></div><div class="field"><label>案件</label><input id="title" required></div><div class="field"><label>現在地</label><input id="current" placeholder="未着手"></div><div class="field"><label>期日</label><input id="due" type="date"></div><div class="field"><label>デッドライン</label><input id="deadline" type="date"></div></div><div class="actions"><button class="btn">追加</button></div></form></div>
<script src="./hub-session.js"></script><script src="./hub-focus.js"></script>
<script>(()=>{const q=s=>document.querySelector(s),HS=window.HubSession,HF=window.HubFocus,K=HS.KEYS,ST=[['select','セレクト'],['develop','現像'],['retouch','レタッチ'],['design','デザイン'],['submit','入稿'],['delivery','納品']],H={select:1.5,develop:4,retouch:3,design:3,submit:.25,delivery:.25},uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),lab=k=>(ST.find(x=>x[0]===k)||[k,k])[1],esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pad=n=>String(Math.floor(n)).padStart(2,'0'),hms=s=>pad(s/3600)+':'+pad((s%3600)/60)+':'+pad(s%60);
let C=HS.getCargo(),sel=null;if(!C.length){C=[{id:uid(),category:'写真',title:'2026.07.31 モアナ｜湊様・三宅様',currentStage:'セレクト済',currentStageKey:'select',currentState:'completed',dueDate:null,deadline:null,rawDeadlineText:'期限9/9',processTemplate:'photo',enabledStages:ST.map(x=>x[0]),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}];HS.write(K.cargo,C)}const active=()=>HS.getActive(),save=()=>HS.write(K.cargo,C);
function risk(c){if(!c.deadline)return['','—','safe'];let e=new Date(c.deadline+'T23:59:59'),n=new Date();if(e<n)return['risk',c.deadline+' OVERDUE','overdue'];let en=c.enabledStages||[],i=en.indexOf(c.currentStageKey),rem=i<0?en:en.slice(c.currentState==='completed'?i+1:i),hrs=rem.reduce((s,k)=>s+(H[k]||0),0),days=Math.max(1/24,(e-n)/86400000),rate=hrs/days,state=days<=1?'critical':rate>=4?'critical':rate>=2?'warning':rate>=1?'watch':'safe',warn=state!=='safe';return[warn?'risk':'',c.deadline+(warn?' ⚠':''),state]}
function nextStage(c){let en=c.enabledStages||[];if(!en.length)return null;let i=en.indexOf(c.currentStageKey);if(i<0)return en[0];return c.currentState==='completed'?(en[i+1]||null):en[i]}
function render(){C=HS.getCargo();let r=q('#rows');r.innerHTML='';q('#empty').style.display=C.length?'none':'block';let a=active();C.forEach(c=>{let z=risk(c),tr=document.createElement('tr'),raw=c.rawDeadlineText?`<div class="raw">${esc(c.rawDeadlineText)}（未分類）</div>`:'',st=nextStage(c),same=a&&a.cargoId===c.id,button=st?`<button class="btn quickStart" data-start="${esc(st)}">${same?(a.phase==='break'?'▶ 再開':'● ACTIVE'):'▶ '+esc(lab(st))}</button>`:'—';tr.dataset.id=c.id;tr.classList.toggle('selected',sel===c.id);tr.innerHTML=`<td>${esc(c.category)}</td><td>${esc(c.title)}${raw}</td><td>${esc(c.currentStage||'未着手')}</td><td>${esc(c.dueDate||'—')}</td><td class="${z[0]}" title="${esc(z[2])}">${esc(z[1])}</td><td class="op">${button}</td>`;tr.onclick=e=>{if(e.target.closest('button'))return;toggleDetail(c.id)};let b=tr.querySelector('[data-start]');if(b)b.onclick=e=>{e.stopPropagation();if(same&&a.phase==='work')return;start(c,b.dataset.start)};r.appendChild(tr)});q('#active').classList.toggle('show',!!a);if(a){q('#activeTitle').textContent=a.cargoTitle;q('#activeStage').textContent=a.stageLabel+' · '+(a.phase==='break'?'Break':'Working');q('#pause').textContent=a.phase==='break'?'再開':'中断'}}
function closeDetail(){sel=null;let d=q('#detail');d.classList.remove('show');d.innerHTML='';render()}
function toggleDetail(id){if(sel===id&&q('#detail').classList.contains('show'))return closeDetail();detail(id)}
function detail(id){sel=id;let c=C.find(x=>x.id===id),d=q('#detail');if(!c)return;let stages=c.processTemplate==='photo'?`<div class="stages">${(c.enabledStages||[]).map(k=>{let l=lab(k),ci=(c.enabledStages||[]).indexOf(c.currentStageKey),i=(c.enabledStages||[]).indexOf(k),done=i>=0&&(i<ci||(i===ci&&c.currentState==='completed')),cur=k===nextStage(c),cl=done?'done':cur?'current':'';return `<span class="stage ${cl}">${l}</span>`}).join('')}</div>`:'',opts=(c.enabledStages||[]).map(k=>`<option value="${esc(k)}">${esc(lab(k))}</option>`).join(''),tot=HS.taskTotals(c.id),raw=c.rawDeadlineText?`<div class="raw">未分類の期限メモ: ${esc(c.rawDeadlineText)}</div>`:'';d.innerHTML=`<div class="detailGrid"><div class="field"><label>カテゴリ</label><input value="${esc(c.category)}" disabled></div><div class="field"><label>案件</label><input id="et" value="${esc(c.title)}"></div><div class="field"><label>期日</label><input id="ed" type="date" value="${esc(c.dueDate||'')}"></div><div class="field"><label>デッドライン</label><input id="ex" type="date" value="${esc(c.deadline||'')}"></div></div>${raw}<div class="totals"><span class="total">累計 Work <b>${hms(tot.workSec)}</b></span><span class="total">Focus <b>${hms(tot.focusSec)}</b></span><span class="total">Sessions <b>${tot.count}</b></span></div>${stages}<div class="actions">${opts?`<select id="stage">${opts}</select><button id="start" class="btn">▶ START</button>`:''}<button id="save" class="btn">保存</button><button id="closeDetail" type="button" class="btn">閉じる</button></div>`;d.classList.add('show');q('#save').onclick=()=>{c.title=q('#et').value.trim()||c.title;c.dueDate=q('#ed').value||null;c.deadline=q('#ex').value||null;if(c.dueDate||c.deadline)c.rawDeadlineText=null;c.updatedAt=new Date().toISOString();save();render();detail(id)};q('#closeDetail').onclick=closeDetail;if(q('#start'))q('#start').onclick=()=>start(c,q('#stage').value)}
function start(c,s){try{let a=active();if(a&&a.cargoId===c.id&&a.stage===s){if(a.phase==='break')HS.resumeWork();render();return}if(a){const end=Date.now();if(HF.getState().mode!=='off')HF.stop('cargo_switched',end);const focusSec=HF.focusTotalForWorkSession(a.sessionId,{includeActive:false,now:end});HS.closeSession({completeStage:false,reason:'switched',focusDurationSec:focusSec,endedAt:end})}HS.startWorkSession({cargoId:c.id,stage:s,stageLabel:lab(s)});render()}catch(e){alert('Cargo切替に失敗しました。現在のSessionは保持されています。\n'+e.message)}}
function pauseOrResume(){const a=active();if(!a)return;if(a.phase==='work'){HS.pauseWork();if(HF.getState().mode!=='off')HF.stop('work_paused')}else HS.resumeWork();render();if(sel)detail(sel)}
function closeOnly(){const a=active();if(!a)return;const end=Date.now();if(HF.getState().mode!=='off')HF.stop('session_closed',end);const focusSec=HF.focusTotalForWorkSession(a.sessionId,{includeActive:false,now:end});try{HS.closeSession({completeStage:false,reason:'closed',focusDurationSec:focusSec,endedAt:end})}catch(e){alert('Session保存に失敗しました。データは保持されています。\n'+e.message);return}render();if(sel)detail(sel)}
function complete(){const a=active();if(!a)return;const end=Date.now();if(HF.getState().mode!=='off')HF.stop('stage_completed',end);const focusSec=HF.focusTotalForWorkSession(a.sessionId,{includeActive:false,now:end});try{HS.closeSession({completeStage:true,reason:'completed',focusDurationSec:focusSec,endedAt:end})}catch(e){alert('Session保存に失敗しました。データは保持されています。\n'+e.message);return}render();if(sel)detail(sel)}
q('#pause').onclick=pauseOrResume;q('#sessionClose').onclick=closeOnly;q('#complete').onclick=complete;q('#add').onclick=()=>q('#form').classList.toggle('show');q('#form').onsubmit=e=>{e.preventDefault();let category=q('#cat').value,photo=category==='写真';C.push({id:uid(),category,title:q('#title').value.trim(),currentStage:q('#current').value.trim()||'未着手',currentStageKey:null,currentState:'idle',dueDate:q('#due').value||null,deadline:q('#deadline').value||null,rawDeadlineText:null,processTemplate:photo?'photo':null,enabledStages:photo?ST.map(x=>x[0]):[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});save();e.target.reset();q('#form').classList.remove('show');render()};window.addEventListener('storage',e=>{if(Object.values(K).includes(e.key)||Object.values(HF.KEYS).includes(e.key)){render();if(sel)detail(sel)}});render()})();</script></body></html>
